expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr
; ─── آپلود چندرسانه‌ای ────────────────────────────────────────────────────────
; محدودیت‌های برنامه: تصویر ۲۰ مگابایت، صوت ۲۰ مگابایت، سند ۲۰ مگابایت و
; ویدیو ۲۰۰ مگابایت (config/config.php). سقف PHP باید از آن بالاتر باشد تا
; فایل‌های بزرگ کامل برسند؛ post_max_size کل درخواست (همهٔ فیلدها) را می‌گیرد.
upload_max_filesize=210M
post_max_size=220M
max_file_uploads=60
; چند فایل هم‌زمان + تبدیل تصویر به webp حافظه می‌خواهد.
memory_limit=512M
max_input_time=120
max_execution_time=120
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
opcache.enable=1
opcache.validate_timestamps=0
