name: SEO / URL / branding audit

# Verifies, against a real HTTP server, the things this project promises about
# SEO, URLs and branding:
#   • every published content type has one canonical direct URL
#   • legacy/duplicate spellings forward to that canonical URL
#   • the sitemap only lists real public URLs and picks up new content
#   • the brand name, the logo and the structured data agree everywhere
#   • /favicon.ico and /assets/img/logo.png are the same file
#
# Two jobs:
#   local  — a throwaway SQLite instance seeded with every content type, served
#            through router.php exactly like production. Runs on every push.
#   live   — the same probe against a real deployment. Started manually with a
#            target URL, and automatically against Production on main.
#
# The probe asserts nothing about ranking and nothing about how a search engine
# chooses to display a logo; it only checks that the technical signals exist.

on:
  push:
    branches: ['**']
  pull_request:
  # Vercel reports every deployment through the GitHub Deployments API, so a
  # successful Production deployment is the exact moment the live probe should
  # run. Probing on push alone races the deployment and measures the previous
  # build; this measures the build that actually went live.
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to audit'
        required: true
        default: 'https://jametulhoda.vercel.app'

permissions:
  # contents:write is only used to publish the probe report as a commit
  # comment, because the Actions log archive and the artifact store are not
  # reachable from every environment.
  contents: write

jobs:
  local:
    name: Seeded local instance
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, curl, zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Build the throwaway SQLite database
        env:
          APP_ENV: development
          DB_DRIVER: sqlite
          SQLITE_PATH: /tmp/jametulhoda-seo.sqlite
          SESSION_DRIVER: files
          UPLOAD_STORAGE: local
        run: |
          rm -f /tmp/jametulhoda-seo.sqlite
          php bin/dev-db.php
          php tests/fixtures/attach-demo-media.php /tmp/jametulhoda-seo.sqlite

      - name: Serve the site through router.php
        env:
          # `local` keeps robots.txt permissive; SQLite is refused in production.
          APP_ENV: local
          DB_DRIVER: sqlite
          SQLITE_PATH: /tmp/jametulhoda-seo.sqlite
          SESSION_DRIVER: files
          UPLOAD_STORAGE: local
          # Production publishes clean URLs, so the probe must exercise those.
          JHD_PRETTY_URLS: 'true'
          SITE_URL: http://127.0.0.1:8080
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then echo "server up"; break; fi
            sleep 1
          done

      - name: Run the SEO probe
        id: probe
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: node tests/seo-probe.mjs 2>&1 | tee seo-probe-report.txt

      - name: Show the PHP server log on failure
        if: failure()
        run: tail -n 60 /tmp/php-server.log || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-probe-local
          path: seo-probe-report.txt
          if-no-files-found: ignore

      # The Actions log archive and the artifact store are not reachable from
      # every environment. Publishing the report as a commit comment keeps the
      # evidence readable through the plain GitHub API.
      - name: Publish the report
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### SEO / URL / branding probe — seeded local instance"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- conclusion: ${{ steps.probe.outcome }}"
            echo
            echo '```text'
            tail -n 200 seo-probe-report.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } > seo-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat seo-comment.md)" >/dev/null

  live:
    name: Live deployment
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || (github.event_name == 'deployment_status'
          && github.event.deployment_status.state == 'success'
          && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A Production deployment is always probed at its stable production
      # alias; a manual run may point the probe anywhere.
      - name: Resolve the target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "deployment_status" ] && [ "${{ github.event.deployment_status.environment }}" = "Production" ]; then
            echo "url=https://jametulhoda.vercel.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://jametulhoda.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the SEO probe against the deployment
        id: live
        env:
          TEST_BASE_URL: ${{ steps.target.outputs.url }}
          SEO_PROBE_TIMEOUT_MS: '90000'
        run: node tests/seo-probe.mjs 2>&1 | tee seo-probe-report.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-probe-live
          path: seo-probe-report.txt
          if-no-files-found: ignore

      # Same reason as above: the log archive is not reachable everywhere, so
      # the evidence is published where the GitHub API can read it.
      - name: Publish the report
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### SEO / URL / branding probe — ${{ steps.target.outputs.url }}"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- conclusion: ${{ steps.live.outcome }}"
            echo
            echo '```text'
            tail -n 200 seo-probe-report.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } > seo-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat seo-comment.md)" >/dev/null
